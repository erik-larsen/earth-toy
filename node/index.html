<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>earth-toy</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #app { position: fixed; inset: 0; }
      #attributions {
        position: fixed;
        bottom: 4px;
        right: 6px;
        max-width: 70vw;
        color: #fff;
        font: 11px/1.4 system-ui, sans-serif;
        text-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
        text-align: right;
        pointer-events: none;
      }
      #message {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        color: #eee;
        font: 15px/1.6 system-ui, sans-serif;
        background: #111;
      }
      #message code { color: #8fd0ff; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="attributions"></div>
    <div id="message"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
